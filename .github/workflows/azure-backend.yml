name: Deploy Backend to Azure

on:
  workflow_dispatch:

# Share the production deployment lock with dev_growton-backend-v2.yml.
concurrency:
  group: growton-backend-v2-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Legacy manual fallback only.
    # This workflow deploys raw source directly, so it must not race the
    # canonical backend workflow that relies on the supported App Service/Oryx path.
    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: .
