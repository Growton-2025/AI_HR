# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - growton-backend-v2

on:
  push:
    branches:
      - dev
    paths:
      - 'backend/**'
      - 'requirements.txt'
      - 'startup.sh'
      - '.github/workflows/dev_growton-backend-v2.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 🛠️ Local Build Section (Optional)
      # The following section in your workflow is designed to catch build issues early on the client side, before deployment. This can be helpful for debugging and validation. However, if this step significantly increases deployment time and early detection is not critical for your workflow, you may remove this section to streamline the deployment process.
      - name: Create and Start virtual environment and Install dependencies
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt
                
      # App Service/Oryx turns this uploaded source artifact into the runtime package
      # used at startup. This app depends on the resulting oryx-manifest.toml,
      # output.tar.zst, and antenv layout, so we deploy only the downloaded artifact
      # directory explicitly in the deploy job below.
      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
          path: backend-artifact

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_887EA0D7D90D483FB2274D5AFB99090E }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_7ED39A8FB036492EA6D22A14F028AF86 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_108A9CA4A8DC4786AAA41FB14BF0CD92 }}

      # Deploy the downloaded backend artifact directory explicitly so the supported
      # App Service/Oryx deployment path stays deterministic across runs.
      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'growton-backend-v2'
          slot-name: 'Production'
          package: backend-artifact
          startup-command: 'gunicorn --bind 0.0.0.0:8000 --workers 4 --worker-class uvicorn.workers.UvicornWorker --timeout 600 --access-logfile - --error-logfile - backend.main:app'

